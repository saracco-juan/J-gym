# Supabase pauses Free projects without enough database activity in a week.
# A read returning zero rows did not prevent it, so this job writes a
# heartbeat row every day through the keep_alive() function
# (supabase/migrations/0003_keep_alive.sql).
# Requires repository secrets SUPABASE_URL and SUPABASE_ANON_KEY.
name: Keep Supabase alive

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write the heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are required"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$SUPABASE_URL/rest/v1/rpc/keep_alive")
          echo "Supabase responded $status"
          test "$status" = "200"
